<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Go Digital Library</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>Go Digital Library</h1>
        <p>Biblioteca digital con Go, PostgreSQL y servicios web JSON</p>
    </header>

    <main>
        <section class="card">
            <h2>Registrar libro</h2>

            <form id="bookForm">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" required>

                <label for="autor">Autor</label>
                <input type="text" id="autor" required>

                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" required>

                <label for="anio">Año</label>
                <input type="number" id="anio" required>

                <button type="submit">Guardar libro</button>
            </form>

            <p id="message"></p>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Libros registrados</h2>
                <button id="reloadBooks">Actualizar</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Categoría</th>
                        <th>Año</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="booksTableBody">
                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>Registrar usuario</h2>

            <form id="userForm">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>

                <label for="correo">Correo</label>
                <input type="email" id="correo" required>

                <button type="submit">Guardar usuario</button>
            </form>

            <p id="userMessage"></p>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Usuarios registrados</h2>
                <button id="reloadUsers">Actualizar</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                </tbody>
            </table>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
